<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flexible Box</title>
    <style>
        .container {
            background-color: lightgrey;

            display: flex;
            flex-flow: row nowrap;
        }

        .item {
            color: white;
            border: 1px solid white;
            background-color: rgb(83, 83, 83);
            text-align: center;
            
            /*
            flex-shrink: 1;  Valor padrão é 1
            flex-grow: 1;    Valor padrão é 0

            flex: flex-grow + flex-shrink + flex-basis
            ==========================================
            */
        }

        #cxA {
            /*flex-shrink: 1;
            flex-grow: 0;
            flex-basis: 300px;*/

            flex: 0 1 300px;
        }

        #cxB {
            /*flex-shrink: 0;
            flex-grow: 2;
            flex-basis: 300px;*/

            flex: 2 0 300px;
        }

        #cxC {
            /*flex-shrink: 2;
            flex-grow: 1;
            flex-basis: 300px;*/

            flex: 1 2 300px;
        }
    </style>
</head>
<body>
    <div class="container"> <!-- PAI -->
        <div class="item" id="cxA">A</div>
        <div class="item" id="cxB">B</div>
        <div class="item" id="cxC">C</div>
    </div>
</body>
</html>
