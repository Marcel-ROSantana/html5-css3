<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout na Prática</title>
    <style>
        .container {
            border: 3px solid blue;
            height: 310px;
            
            /* Propriedade de grid explícito */
            display: grid;
            grid-template-rows: 100px 100px 100px; /* ou repeat(3, 100px)*/
            grid-template-columns: auto auto auto; /* ou repeat(3, auto) */
            /* grid-template: 100px 100px 100px / auto auto auto; ou repeat(3, 100px)/repeat(3, auto) */
            gap: 5px; /* substituiu o grid-gap */

            align-items: normal;     
            justify-items: normal; 
            /* place-items: normal normal; */

            align-content: normal;    /* start, center, end, space-between, space-evenly e space-around */
            justify-content: normal;  /* start, center, end, space-between, space-evenly e space-around */
            /* place-content: normal normal; */   

            /* Propriedade de grid implícito */
            grid-auto-rows: 100px; 
            grid-auto-columns: 100px;
        }

        .item {
            border: 3px solid red;
            padding: 5px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item">A</div>
        <div class="item">B</div>
        <div class="item">C</div>
        <div class="item">D</div>
        <div class="item">E</div>
        <div class="item">F</div>
        <div class="item">G</div>
        <div class="item">H</div>
        <div class="item">I</div>
        <!-- <div class="item">J</div> -->
    </div>
</body>
</html>
